title: Thorsten Weberger
email: your.email@example.com
author: Thorsten Weberger
description: >-
  Analytics Engineer / Data Engineer — portfolio and project showcase.

baseurl: ""
url: ""

theme: jekyll-theme-yat

copyright: "Copyright (cleft) {currentYear} {author}"

header_pages:
  - index.md
  - projects.md
  - about.md

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-spaceship

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - THIRD_PARTY_LICENSES.md

baseurl: ''
permalink: pretty
title: 'Thorsten Weberger'

logo:
  mobile: "images/logo/logo-mobile.svg"
  mobile_height: "32px"
  mobile_width: "32px"
  desktop: "images/logo/logo.svg"
  desktop_height: "32px"
  desktop_width: "160px"

home:
  limit_projects: 6

collections:
  projects:
    output: true
    sort_by: weight

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

sass:
  style: compressed # possible values: nested expanded compact compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - THIRD_PARTY_LICENSES.md

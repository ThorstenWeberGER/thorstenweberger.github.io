<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
  <!-- Faint, fine-line motif for the homepage banner: a data lineage graph
       (sources -> layers -> one output), a dot grid and a trend line. -->
  <g stroke-opacity="0.07" fill="#ffffff" fill-opacity="0.07" stroke="none">
    <circle cx="300" cy="300" r="1.4"/><circle cx="330" cy="300" r="1.4"/><circle cx="360" cy="300" r="1.4"/><circle cx="390" cy="300" r="1.4"/><circle cx="420" cy="300" r="1.4"/><circle cx="450" cy="300" r="1.4"/><circle cx="480" cy="300" r="1.4"/><circle cx="510" cy="300" r="1.4"/><circle cx="540" cy="300" r="1.4"/><circle cx="570" cy="300" r="1.4"/><circle cx="600" cy="300" r="1.4"/>
    <circle cx="330" cy="330" r="1.4"/><circle cx="360" cy="330" r="1.4"/><circle cx="390" cy="330" r="1.4"/><circle cx="420" cy="330" r="1.4"/><circle cx="450" cy="330" r="1.4"/><circle cx="480" cy="330" r="1.4"/><circle cx="510" cy="330" r="1.4"/><circle cx="540" cy="330" r="1.4"/><circle cx="570" cy="330" r="1.4"/><circle cx="600" cy="330" r="1.4"/>
    <circle cx="390" cy="360" r="1.4"/><circle cx="420" cy="360" r="1.4"/><circle cx="450" cy="360" r="1.4"/><circle cx="480" cy="360" r="1.4"/><circle cx="510" cy="360" r="1.4"/><circle cx="540" cy="360" r="1.4"/><circle cx="570" cy="360" r="1.4"/><circle cx="600" cy="360" r="1.4"/>
    <circle cx="450" cy="390" r="1.4"/><circle cx="480" cy="390" r="1.4"/><circle cx="510" cy="390" r="1.4"/><circle cx="540" cy="390" r="1.4"/><circle cx="570" cy="390" r="1.4"/><circle cx="600" cy="390" r="1.4"/>
  </g>

  <!-- trend line through the grid -->
  <path d="M290 372 L340 352 L380 362 L425 326 L470 336 L515 296 L560 306 L610 262" stroke-opacity="0.12" stroke-width="1.2"/>

  <!-- lineage edges -->
  <g stroke-opacity="0.13" stroke-width="1.1">
    <path d="M86 70 C150 70 150 120 214 120"/>
    <path d="M86 140 C150 140 150 120 214 120"/>
    <path d="M86 140 C150 140 150 200 214 200"/>
    <path d="M86 210 C150 210 150 200 214 200"/>
    <path d="M86 280 C150 280 150 200 214 200"/>
    <path d="M226 120 C290 120 290 160 354 160"/>
    <path d="M226 200 C290 200 290 160 354 160"/>
    <path d="M226 200 C290 200 290 250 354 250"/>
    <path d="M366 160 C430 160 430 200 494 200"/>
    <path d="M366 250 C430 250 430 200 494 200"/>
  </g>

  <!-- nodes: sources, layers, output -->
  <g stroke-opacity="0.18" stroke-width="1.2">
    <rect x="62" y="62" width="24" height="16" rx="3"/>
    <rect x="62" y="132" width="24" height="16" rx="3"/>
    <rect x="62" y="202" width="24" height="16" rx="3"/>
    <rect x="62" y="272" width="24" height="16" rx="3"/>
    <circle cx="220" cy="120" r="6"/>
    <circle cx="220" cy="200" r="6"/>
    <circle cx="360" cy="160" r="6"/>
    <circle cx="360" cy="250" r="6"/>
    <circle cx="500" cy="200" r="6"/>
    <circle cx="500" cy="200" r="13" stroke-opacity="0.10"/>
    <circle cx="500" cy="200" r="22" stroke-opacity="0.06" stroke-dasharray="2 5"/>
  </g>

  <!-- faint layer guides -->
  <g stroke-opacity="0.05" stroke-width="1" stroke-dasharray="1 7">
    <path d="M150 40 V310"/>
    <path d="M290 40 V310"/>
    <path d="M430 40 V310"/>
  </g>
</svg>

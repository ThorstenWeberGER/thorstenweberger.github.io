<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 520 270" fill="none" stroke="#ffffff" stroke-linecap="square" stroke-linejoin="miter">
  <!-- Faint, fine-line motif for the homepage banner: a data lineage graph
       (source tables -> two layers -> one output), boxes and right-angle
       connectors only. -->

  <!-- connectors -->
  <g opacity="0.13" stroke-width="1.1">
    <path d="M86 70 H150 V120 H210"/>
    <path d="M86 140 H150 V120"/>
    <path d="M86 140 H150 V200 H210"/>
    <path d="M86 210 H150 V200"/>
    <path d="M86 280 H150 V200"/>
    <path d="M230 120 H290 V160 H350"/>
    <path d="M230 200 H290 V160"/>
    <path d="M230 200 H290 V250 H350"/>
    <path d="M370 160 H430 V200 H487"/>
    <path d="M370 250 H430 V200"/>
  </g>

  <!-- boxes: sources, two layers, output -->
  <g stroke-opacity="0.18" stroke-width="1.2">
    <rect x="62" y="62" width="24" height="16"/>
    <rect x="62" y="132" width="24" height="16"/>
    <rect x="62" y="202" width="24" height="16"/>
    <rect x="62" y="272" width="24" height="16"/>
    <rect x="210" y="113" width="20" height="14"/>
    <rect x="210" y="193" width="20" height="14"/>
    <rect x="350" y="153" width="20" height="14"/>
    <rect x="350" y="243" width="20" height="14"/>
    <rect x="487" y="191" width="26" height="18"/>
    <rect x="480" y="184" width="40" height="32" stroke-opacity="0.10"/>
    <rect x="472" y="176" width="56" height="48" stroke-opacity="0.06" stroke-dasharray="3 5"/>
  </g>
</svg>
